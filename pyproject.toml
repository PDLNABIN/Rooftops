[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rooftops"
version = "0.1.0"
description = "Fine-tune the HOTOSM DINOv3 building UPerNet model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "affine>=2.4",
    "numpy>=1.24",
    "Pillow>=9.5",
    "rasterio>=1.3",
    "scipy>=1.10",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "terratorch>=1.2",
    "torch>=2.0",
]

[project.scripts]
rooftops-finetune = "rooftops.finetune:main"
rooftops-infer = "rooftops.infer:main"

[tool.setuptools.packages.find]
where = ["src"]
