# Paths and settings for training the HOTOSM building-footprint decoder.
# Command-line arguments override values in this file.
training:
  checkpoint: model.ckpt
  coco: annot/instances_default.json
  images: Images
  footprints:
  out: dinov3s-buildings-finetuned.ckpt
  epochs: 50
  bs: 1
  n_per_tile: 12
  crop: 256
  input_size: 256
  lr: 0.0001
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  workers: 0
  val_every: 5
  seed: 0
  metrics_dir:
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0001
  classifier_epochs: 20
  classifier_lr: 0.001
  classifier_weight_decay: 0.01

inference:
  checkpoint: dinov3s-buildings-finetuned.ckpt
  image: test_images
  out_dir: inference_all
  input_size: 256
  threshold: 0.5
